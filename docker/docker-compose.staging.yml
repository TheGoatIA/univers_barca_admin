# Back-office (staging) — servi par nginx derrière le reverse proxy TLS du VPS.
name: univers-barca-admin-staging

networks:
  # Réseau de l'API (staging) créé par univers_barca_api : permet le proxy /api sans exposer l'API
  api:
    external: true
    name: univers-barca-staging_public

services:
  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/thegoatia/univers_barca_admin:staging-latest}
    container_name: ub-staging-admin
    environment:
      API_UPSTREAM: ub-staging-api:5000
    ports:
      - "127.0.0.1:8082:8080"
    networks: [api]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /etc/nginx/conf.d]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.25" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
