# SPA React : fallback vers index.html + proxy de l'API (même origine, cookies httpOnly du back-office).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Sondes
  location = /healthz { access_log off; add_header Content-Type text/plain; include /etc/nginx/security-headers.conf; return 200 'ok'; }

  # En-têtes de sécurité (répétés par include dans les blocs qui déclarent leurs propres add_header)
  include /etc/nginx/security-headers.conf;

  # Proxy API (le nom d'hôte « api » est résolu dans le réseau Docker du VPS)
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets fingerprintés : cache long ; index.html jamais mis en cache
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/security-headers.conf; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-store"; include /etc/nginx/security-headers.conf; }
  location / { try_files $uri $uri/ /index.html; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
