name: CodeQL (qualité & sécurité du code)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyse CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          # Le dépôt privé sans GitHub Advanced Security refuse l'envoi SARIF : on publie le rapport en artefact.
          # Activer « Code scanning » puis passer upload à always pour alimenter l'onglet Sécurité.
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-results
          path: codeql-results
          retention-days: 7
